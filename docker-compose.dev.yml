# Radio Bloom - Local Development
# Redis + Liquidsoap + Web (publisher runs outside with bun run dev)
# Usage: docker compose -f docker-compose.dev.yml up

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  liquidsoap:
    image: savonet/liquidsoap:v2.4.5
    ports:
      - "8000:8000"
      - "8001:8001"
      - "8002:8002/udp"
      - "1234:1234"
    volumes:
      - ./liquidsoap/radio.liq:/etc/liquidsoap/radio.liq
      - ./music/songs:/music/songs
      - ./music/interludios:/music/interludios
    command: /etc/liquidsoap/radio.liq
    healthcheck:
      test: ["CMD-SHELL", "timeout 3 bash -c '</dev/tcp/localhost/8000' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  web:
    build:
      context: .
      dockerfile: ./web/Dockerfile
    ports:
      - "4321:80"
    volumes:
      - ./web/src:/app/src
      - ./web/public:/app/public
      - ./web/astro.config.mjs:/app/astro.config.mjs
      - ./web/tsconfig.json:/app/tsconfig.json
    environment:
      - HOST=0.0.0.0
      - PORT=80

volumes:
  redis_data:
