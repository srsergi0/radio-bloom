# Radio Bloom - Docker Compose

services:
  # ──────────────────────────────────────────────
  # Init - Create required directories
  # ──────────────────────────────────────────────
  init:
    image: alpine:latest
    volumes:
      - ./:/workspace
    entrypoint: /bin/sh -c "mkdir -p /workspace/music/songs /workspace/music/interludios && chmod -R 755 /workspace/music/songs /workspace/music/interludios"

  # ──────────────────────────────────────────────
  # Redis - Queue & Caching
  # ──────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Sin puerto publicado (solo red interna) y con contraseña: la instancia
    # expuesta en 0.0.0.0:6379 fue comprometida en oct-2026.
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD requerido}
      --protected-mode yes
      --rename-command REPLICAOF ""
      --rename-command SLAVEOF ""
      --rename-command MODULE ""
      --rename-command DEBUG ""
    volumes:
      - redis_data:/data

  # ──────────────────────────────────────────────
  # Buncaster - Streaming Engine (Bun + FFmpeg)
  # ──────────────────────────────────────────────
  buncaster:
    image: ghcr.io/srsergi0/buncaster-cli:latest
    container_name: buncaster
    restart: unless-stopped
    depends_on:
      init:
        condition: service_completed_successfully
    ports:
      - "${PORT}:${PORT}"
      - "${SRT_PORT:-1936}:1936/udp"
    env_file:
      - .env
    volumes:
      - ./music:/app/music
      - moq-secrets:/moq-secrets   # certificados efímeros + clave JWT de MoQ
    # Healthcheck usa el integrado de la imagen (HEALTHCHECK cada 30s en /health)

  # ──────────────────────────────────────────────
  # Publisher - API + Stream Broadcaster
  # ──────────────────────────────────────────────
  publisher:
    build:
      context: .
      dockerfile: ./publisher/Dockerfile
    restart: unless-stopped
    mem_limit: 512m
    ports:
      - "${API_PORT}:${PUBLISHER_PORT}"
    environment:
      - BUNCASTER_HOST=buncaster
      - BUNCASTER_PORT=${PORT}
      - BUNCASTER_ADMIN_USER=${ADMIN_USER}
      - BUNCASTER_ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - PORT=${PUBLISHER_PORT}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - SPOTIFY_CLIENT_ID=${SPOTIFY_CLIENT_ID}
      - SPOTIFY_CLIENT_SECRET=${SPOTIFY_CLIENT_SECRET}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - AI_DJ_ENABLED=${AI_DJ_ENABLED}
      - AI_DJ_OPENROUTER_MODEL=${AI_DJ_OPENROUTER_MODEL}
      - AI_DJ_VOICE=${AI_DJ_VOICE}
      - STREAM_TIER=${STREAM_TIER:-dual}
      - OPUS_UPSTREAM_URL=${OPUS_UPSTREAM_URL:-}
      - STREAM_BURST_SECONDS=${STREAM_BURST_SECONDS:-4}
      - STREAM_BITRATE_KBPS=${STREAM_BITRATE_KBPS:-320}
      - OPUS_TIER_BITRATE_KBPS=${OPUS_TIER_BITRATE_KBPS:-192}
      - MP3_UPSTREAM_URL=${MP3_UPSTREAM_URL:-}
      - STUDIO_TOKEN=${STUDIO_TOKEN:-}
      - STUDIO_SESSION_SECRET=${STUDIO_SESSION_SECRET:-}
      - REQUESTS_AUTO_APPROVE=${REQUESTS_AUTO_APPROVE:-false}
      - PUBLIC_HOST=${PUBLIC_HOST:-}
      - SRT_PORT=${SRT_PORT:-1936}
      - RTMP_STREAM_KEY=${RTMP_STREAM_KEY:-}
    volumes:
      - ./music:/app/music
      - radio-publisher-data:/app/data
    depends_on:
      init:
        condition: service_completed_successfully
      redis:
        condition: service_started
      buncaster:
        condition: service_healthy

  # ──────────────────────────────────────────────
  # Web - Frontend (Astro)
  # ──────────────────────────────────────────────
  web:
    build:
      context: .
      dockerfile: ./web/Dockerfile
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-80}:80"
    depends_on:
      publisher:
        condition: service_started

  # ──────────────────────────────────────────────
  # MoQ relay - audio de baja latencia por WebTransport (UDP 4433)
  # Imagen local: docker build -t buncaster-moq-relay:0.17.17 /root/projects/buncaster-cli/moq/relay
  # ──────────────────────────────────────────────
  moq-relay:
    image: buncaster-moq-relay:0.17.17
    container_name: moq-relay
    restart: unless-stopped
    depends_on:
      - buncaster
    environment:
      MOQ_LIMIT_PER_IP: "8"
    volumes:
      - moq-secrets:/certs:ro
    ports:
      - "4433:4433/udp"   # solo este; 4434 (publicación) queda en la red docker
    cpus: 1.0
    mem_limit: 256m

  # ──────────────────────────────────────────────
  # Tunnel - radio.tceoslabs.com (Cloudflare Tunnel propio, sin puertos)
  # ──────────────────────────────────────────────
  tunnel:
    image: cloudflare/cloudflared:2026.11.1
    container_name: bloom-tunnel
    restart: unless-stopped
    command: tunnel --config /etc/cloudflared/config.yml run
    depends_on:
      web:
        condition: service_started
    volumes:
      - ./tunnel/config.yml:/etc/cloudflared/config.yml:ro
      - /etc/cloudflared-bloom/credentials.json:/etc/cloudflared/credentials.json:ro
    mem_limit: 64m
    cpus: 0.25
    read_only: true

  # ──────────────────────────────────────────────
  # FTP - Song Upload Server (vsftpd) - DISABLED
  # ──────────────────────────────────────────────
  # ftp:
  #   image: fauria/vsftpd
  #   restart: unless-stopped
  #   ports:
  #     - "${FTP_PORT}:21"
  #     - "${FTP_PASSIVE_MIN}-${FTP_PASSIVE_MAX}:${FTP_PASSIVE_MIN}-${FTP_PASSIVE_MAX}"
  #   volumes:
  #     - ./music/songs:/home/vsftpd/radio/songs
  #     - ./music/interludios:/home/vsftpd/radio/interludios
  #   environment:
  #     - FTP_USER=${FTP_USER_NAME}
  #     - FTP_PASS=${FTP_USER_PASS}
  #     - PASV_ADDRESS=${FTP_PUBLIC_HOST}
  #     - PASV_MIN_PORT=${FTP_PASSIVE_MIN}
  #     - PASV_MAX_PORT=${FTP_PASSIVE_MAX}
  #     - LOG_STDOUT=YES

volumes:
  radio-publisher-data:
  redis_data:
  moq-secrets:
