# Radio Bloom - Docker Compose

services:
  # ──────────────────────────────────────────────
  # Init - Create required directories
  # ──────────────────────────────────────────────
  init:
    image: alpine:latest
    volumes:
      - ./:/workspace
    entrypoint: /bin/sh -c "mkdir -p /workspace/music/songs /workspace/music/interludios && chmod -R 755 /workspace/music/songs /workspace/music/interludios"

  # ──────────────────────────────────────────────
  # Redis - Queue & Caching
  # ──────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  # ──────────────────────────────────────────────
  # Buncaster - Streaming Engine (Bun + FFmpeg)
  # ──────────────────────────────────────────────
  buncaster:
    image: ghcr.io/srsergi0/buncaster-cli:latest
    container_name: buncaster
    restart: unless-stopped
    depends_on:
      init:
        condition: service_completed_successfully
    ports:
      - "${PORT}:${PORT}"
      - "${SRT_PORT:-1936}:1936/udp"
    env_file:
      - .env
    volumes:
      - ./music:/app/music
    # Healthcheck usa el integrado de la imagen (HEALTHCHECK cada 30s en /health)

  # ──────────────────────────────────────────────
  # Publisher - API + Stream Broadcaster
  # ──────────────────────────────────────────────
  publisher:
    build:
      context: .
      dockerfile: ./publisher/Dockerfile
    restart: unless-stopped
    mem_limit: 512m
    ports:
      - "${API_PORT}:${PUBLISHER_PORT}"
    environment:
      - BUNCASTER_HOST=buncaster
      - BUNCASTER_PORT=${PORT}
      - BUNCASTER_ADMIN_USER=${ADMIN_USER}
      - BUNCASTER_ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - PORT=${PUBLISHER_PORT}
      - REDIS_URL=redis://redis:6379/0
      - SPOTIFY_CLIENT_ID=${SPOTIFY_CLIENT_ID}
      - SPOTIFY_CLIENT_SECRET=${SPOTIFY_CLIENT_SECRET}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - AI_DJ_ENABLED=${AI_DJ_ENABLED}
      - AI_DJ_OPENROUTER_MODEL=${AI_DJ_OPENROUTER_MODEL}
      - AI_DJ_VOICE=${AI_DJ_VOICE}
      - STREAM_TIER=${STREAM_TIER:-dual}
      - OPUS_UPSTREAM_URL=${OPUS_UPSTREAM_URL:-}
      - MP3_UPSTREAM_URL=${MP3_UPSTREAM_URL:-}
    volumes:
      - ./music:/app/music
      - radio-publisher-data:/app/data
    depends_on:
      init:
        condition: service_completed_successfully
      redis:
        condition: service_started
      buncaster:
        condition: service_healthy

  # ──────────────────────────────────────────────
  # Web - Frontend (Astro)
  # ──────────────────────────────────────────────
  web:
    build:
      context: .
      dockerfile: ./web/Dockerfile
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-80}:80"
    depends_on:
      publisher:
        condition: service_started

  # ──────────────────────────────────────────────
  # FTP - Song Upload Server (vsftpd) - DISABLED
  # ──────────────────────────────────────────────
  # ftp:
  #   image: fauria/vsftpd
  #   restart: unless-stopped
  #   ports:
  #     - "${FTP_PORT}:21"
  #     - "${FTP_PASSIVE_MIN}-${FTP_PASSIVE_MAX}:${FTP_PASSIVE_MIN}-${FTP_PASSIVE_MAX}"
  #   volumes:
  #     - ./music/songs:/home/vsftpd/radio/songs
  #     - ./music/interludios:/home/vsftpd/radio/interludios
  #   environment:
  #     - FTP_USER=${FTP_USER_NAME}
  #     - FTP_PASS=${FTP_USER_PASS}
  #     - PASV_ADDRESS=${FTP_PUBLIC_HOST}
  #     - PASV_MIN_PORT=${FTP_PASSIVE_MIN}
  #     - PASV_MAX_PORT=${FTP_PASSIVE_MAX}
  #     - LOG_STDOUT=YES

volumes:
  radio-publisher-data:
  redis_data:
